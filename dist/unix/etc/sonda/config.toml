## This is sonda's configuration file.

## We specify options with their default value but leave them
## commented out. Uncomment and modify them to override.

## The spool directory (`/var/spool/sonda`), the metrics directory
## (`/var/lib/sonda/metrics`), and the socket path are not configurable
## here, since the systemd units and the package scripts also depend
## on them. To relocate a directory, use a bind mount or a symlink.

[inetd.ptnop]
## Close idle client connections after this time.
##
## The value is a Go time duration string.
#idle-timeout = "60s"

[spool.gc]
## Age after which measurements are removed from the spool.
##
## The value is a Go time duration string.
##
## Keep it well above the interval of `sonda-etl-ptnop-qoe.timer`
## (1h), otherwise spans may be removed before their metrics are
## extracted. The ETL only looks at spans newer than 6h, so raising
## this value does not let the ETL recover from longer outages.
##
## With the default workflow, the spool grows by about 25 MB/hour.
#max-age = "6h"
