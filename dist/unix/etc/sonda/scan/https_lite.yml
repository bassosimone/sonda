name: "https_lite"

cadence: "@hourly/4"

steps:
  - name: "STUN lookup"
    run: stun
    with:
      optimize: size
      port: 19302
      server: stun.l.google.com

  - name: "HTTPS GET www.example.com"
    run: https
    with:
      host: www.example.com
      optimize: size

  - name: "HTTPS GET Google generate_204"
    run: https
    with:
      host: www.google.com
      optimize: size
      url_path: /generate_204

  - name: "HTTPS GET Cloudflare cdn-cgi/trace"
    run: https
    with:
      host: www.cloudflare.com
      optimize: size
      url_path: /cdn-cgi/trace

triggers:
  # Uncomment to archive at /var/lib/sonda/archive.
  #- "etl-ptnop-archive"

  # Comment out to stop updating the Prometheus exporter.
  - "etl-ptnop-prom"
